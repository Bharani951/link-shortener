server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: /stats/abc is not a real file, it's a TanStack Router page.
    # Try the file; if it doesn't exist, send index.html and let the router draw the page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite puts a content hash in these file names (index-a1b2c3.js), so they never change.
    # The browser may cache them for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}