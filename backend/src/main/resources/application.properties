spring.application.name=shortener

# Where MongoDB lives. Spring Boot 4 renamed this from spring.data.mongodb.uri
spring.mongodb.uri=mongodb://localhost:27017/shortener

# Let Spring Data create the indexes we declare with @Indexed (it's off by default)
spring.data.mongodb.auto-index-creation=true

# Our own settings (read by AppProperties.java)
app.base-url=http://localhost:8080
app.frontend-origin=http://localhost:3000